# Automatically track KillDaWill/AnimaEngine without overwriting local work.
# Releases are generated by this workflow itself (GITHUB_TOKEN pushes do not
# trigger normal push workflows). The source scripts package the GUI and CLI.
name: Sync upstream and release builds

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animaengine-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and merge upstream
    if: github.repository == '969981/AnimaEngine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      commit: ${{ steps.check.outputs.commit }}
      upstream: ${{ steps.check.outputs.upstream }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - id: check
        name: Merge upstream, decide whether release is missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KillDaWill/AnimaEngine.git
          git fetch --no-tags upstream main
          upstream_sha=$(git rev-parse upstream/main)

          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            # Preserve mirror-local commits, custom workflows, and other branches.
            # On a merge conflict, fail rather than force-pushing or dropping changes.
            git merge --no-ff -m "chore(sync): upstream $upstream_sha" upstream/main
            git push origin HEAD:main
            echo "Synchronized to upstream $upstream_sha"
          else
            echo "No new upstream commits: $upstream_sha"
          fi

          tag="sync-${upstream_sha:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Already published $tag."
            exit 0
          fi
          # Also covers first build and retries if the previous release failed.
          {
            echo 'publish=true'
            echo "commit=$(git rev-parse HEAD)"
            echo "upstream=$upstream_sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build ${{ matrix.platform }}
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      RAYLIB_VERSION: '5.5'
      SNAPSHOT_TAG: ${{ needs.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config zip \
            libpng-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev libxi-dev libasound2-dev

      - name: Build static raylib (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RAYLIB_VERSION" https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/raylib-install
          cmake --build /tmp/raylib-build --target install --config Release --parallel 2

      - name: Compile, test, and package (Linux)
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_PATH: /tmp/raylib-install/lib/pkgconfig:/tmp/raylib-install/lib64/pkgconfig
        run: |
          set -euo pipefail
          make PKG_CONFIG="pkg-config --static"
          make gui PKG_CONFIG="pkg-config --static"
          make test PKG_CONFIG="pkg-config --static"
          bash scripts/package_release.sh "${{ matrix.platform }}" "$SNAPSHOT_TAG"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-raylib

      - name: Compile, test, and package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make
          make gui
          make test
          bash scripts/package_release.sh "${{ matrix.platform }}" "$SNAPSHOT_TAG"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libpng raylib

      - name: Compile, test, and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          make
          make gui
          make test
          bash scripts/package_release.sh "${{ matrix.platform }}" "$SNAPSHOT_TAG"

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: AnimaEngine-${{ needs.sync.outputs.tag }}-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [sync, package]
    if: needs.sync.outputs.publish == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download all four packages
        uses: actions/download-artifact@v4
        with:
          pattern: AnimaEngine-${{ needs.sync.outputs.tag }}-*
          path: dist
          merge-multiple: true

      - name: Check contents and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          test -n "$(find dist -maxdepth 1 -type f -name '*linux-x86_64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*windows-x86_64.zip' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macos-arm64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macos-x86_64.tar.gz' -print -quit)"
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create exactly one GitHub prerelease per upstream revision
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
          MIRROR_SHA: ${{ needs.sync.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released $TAG"
            exit 0
          fi
          cat > release-notes.md <<EOF
          Automated binary snapshot of [KillDaWill/AnimaEngine](https://github.com/KillDaWill/AnimaEngine).

          - Upstream commit: $UPSTREAM_SHA
          - Mirror commit: $MIRROR_SHA
          - Linux x86-64, Windows x86-64, macOS arm64, macOS Intel x86-64
          - Native CLI and GUI compiled from source; unit tests run on each platform
          - SHA256 checksums included
          - CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          No ROMs or proprietary Pokémon assets are bundled.
          This is an automated prerelease snapshot, not an official upstream tag.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MIRROR_SHA" \
            --title "AnimaEngine upstream ${UPSTREAM_SHA:0:12}" \
            --notes-file release-notes.md \
            --prerelease
